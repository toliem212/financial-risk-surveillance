name: Market ingestion

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Every 30 minutes from 08:00-17:59 Asia/Bangkok on weekdays.
    - cron: '15 1-11 * * 1-5'

concurrency:
  group: market-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add HNX/CBIS GlobalSign intermediate CA
        shell: bash
        run: |
          curl -fsSL -o /tmp/globalsign-hnx.crt https://secure.globalsign.com/cacert/gsgccr3evtlsca2025.crt
          python -c "import ssl, certifi; from pathlib import Path; der=Path('/tmp/globalsign-hnx.crt').read_bytes(); pem=ssl.DER_cert_to_PEM_cert(der).encode('ascii'); Path('/tmp/hnx-ca-bundle.pem').write_bytes(Path(certifi.where()).read_bytes()+b'\n'+pem)"
          echo "REQUESTS_CA_BUNDLE=/tmp/hnx-ca-bundle.pem" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/tmp/hnx-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Preflight database and raw archive
        run: python -m src.system.preflight --require-postgres --require-cloud-raw
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run isolated market-source cycle
        run: python -m src.jobs.market_cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_RAW_BUCKET: raw-market-data
