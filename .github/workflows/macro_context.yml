name: Slow-moving macro context

on:
  workflow_dispatch:
  schedule:
    # Once each weekday morning; SBV pages expose only the latest reference month.
    - cron: '20 0 * * 1-5'

concurrency:
  group: macro-context
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preflight database and raw archive
        run: python -m src.system.preflight --require-postgres --require-cloud-raw
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run SBV monetary context worker
        run: python -m src.jobs.sbv_macro_once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_RAW_BUCKET: raw-market-data
