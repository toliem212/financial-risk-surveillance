name: VIRA semantic ingestion

on:
  workflow_dispatch:
  schedule:
    # 07:00-12:59 Asia/Bangkok, weekdays. Publication-driven source: 30-minute poll is enough.
    - cron: '35 1,5,9 * * 1-5'

concurrency:
  group: vira-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preflight database
        run: python -m src.system.preflight --require-postgres --require-cloud-raw
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run VIRA semantic worker
        run: python -m src.jobs.vira_once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_RAW_BUCKET: raw-market-data
