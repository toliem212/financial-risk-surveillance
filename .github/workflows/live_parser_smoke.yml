name: Live parser smoke

on:
  workflow_dispatch:
    inputs:
      hnx_date:
        description: 'HNX date YYYY-MM-DD (optional; defaults to runner date)'
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add HNX/CBIS GlobalSign intermediate CA
        shell: bash
        run: |
          curl -fsSL -o /tmp/globalsign-hnx.crt https://secure.globalsign.com/cacert/gsgccr3evtlsca2025.crt
          python -c "import ssl, certifi; from pathlib import Path; der=Path('/tmp/globalsign-hnx.crt').read_bytes(); pem=ssl.DER_cert_to_PEM_cert(der).encode('ascii'); Path('/tmp/hnx-ca-bundle.pem').write_bytes(Path(certifi.where()).read_bytes()+b'\n'+pem)"
          echo "REQUESTS_CA_BUNDLE=/tmp/hnx-ca-bundle.pem" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/tmp/hnx-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Fetch and parse live public sources without writing data
        shell: bash
        run: |
          if [ -n "${{ inputs.hnx_date }}" ]; then
            python -m src.system.live_parser_smoke --hnx-date "${{ inputs.hnx_date }}"
          else
            python -m src.system.live_parser_smoke
          fi
